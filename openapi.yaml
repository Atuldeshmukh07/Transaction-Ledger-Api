openapi: 3.0.3
info:
  title: Transaction Ledger API
  version: 1.0.0
  description: Account, transaction ledger and atomic money transfer API.
servers:
  - url: http://localhost:3000/api
paths:
  /accounts:
    post:
      summary: Create account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, example: Atul Deshmukh }
      responses:
        '201': { description: Account created with zero balance }
        '400': { description: Invalid request }
  /accounts/{accountId}/balance:
    get:
      summary: Get current account balance
      parameters:
        - in: path
          name: accountId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Current balance }
        '404': { description: Account not found }
  /accounts/{accountId}/transactions:
    post:
      summary: Create credit or debit transaction
      parameters:
        - in: path
          name: accountId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, amount, reference_id]
              properties:
                type: { type: string, enum: [credit, debit] }
                amount: { type: number, exclusiveMinimum: 0, example: 50 }
                description: { type: string, example: Salary credit }
                reference_id: { type: string, example: salary-2026-10 }
      responses:
        '201': { description: Transaction created }
        '404': { description: Account not found }
        '409': { description: Duplicate reference ID }
        '422': { description: Insufficient balance }
    get:
      summary: Get transaction history
      parameters:
        - in: path
          name: accountId
          required: true
          schema: { type: string }
        - in: query
          name: type
          schema: { type: string, enum: [credit, debit] }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        '200': { description: Paginated newest-first transactions }
        '400': { description: Invalid filter or pagination }
        '404': { description: Account not found }
  /transfers:
    post:
      summary: Atomically transfer money between accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from_account_id, to_account_id, amount, reference_id]
              properties:
                from_account_id: { type: string }
                to_account_id: { type: string }
                amount: { type: number, exclusiveMinimum: 0 }
                reference_id: { type: string }
                description: { type: string }
      responses:
        '201': { description: Transfer completed }
        '400': { description: Invalid request }
        '404': { description: Account not found }
        '409': { description: Duplicate transfer reference }
        '422': { description: Insufficient balance }


services:
  mongo:
    image: mongo:7
    container_name: ledger-mongo
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { quit(db.adminCommand({ping:1}).ok ? 0 : 1) } catch (e) { quit(1) }"
      interval: 5s
      timeout: 10s
      retries: 10

  app:
    image: node:22
    working_dir: /app
    container_name: ledger-api
    command: sh -c "npm install && npm start"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      MONGODB_URI: mongodb://mongo:27017/transaction_ledger?replicaSet=rs0
      PORT: 3000
      NODE_ENV: development
    depends_on:
      mongo:
        condition: service_started

volumes:
  mongo_data:
